name: Single-host deployment contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GUANXIAN_SINGLE_HOST_DB_TEST: '1'
      GUANXIAN_SINGLE_HOST_GATEWAY_TEST: '1'
      GUANXIAN_SINGLE_HOST_MINIO_TEST: '1'
      GUANXIAN_NGINX_ETAG_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull official isolated test images
        run: |
          docker pull postgres:16-alpine
          docker pull nginx:stable-alpine
          docker pull minio/minio:RELEASE.2025-04-22T22-12-26Z
          docker pull minio/mc:latest
          docker pull python:3.12-slim-bookworm
          docker pull "$(awk '$1 == "FROM" && $4 == "runtime" {print $2}' apps/web/Dockerfile)"
      - name: Test single-host generation, PostgreSQL, real MinIO bootstrap and Nginx configuration
        run: python -m unittest discover -s tests/config -p 'test_single_host*.py' -v
      - name: Test strong ETags through the actual web Nginx runtime
        run: python -m unittest discover -s tests/config -p 'test_nginx_etag.py' -v
      - name: Check startup script syntax
        run: |
          sh -n infrastructure/single-host/postgres-init.sh
          sh -n infrastructure/single-host/minio-init.sh
          bash -n infrastructure/single-host/keycloak-start.sh
