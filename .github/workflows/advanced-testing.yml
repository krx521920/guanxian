name: Advanced Testing

on:
  workflow_dispatch:

# This workflow is deliberately manual-only. Disallowed active-network and
# high-load jobs were removed from CI and must not be reintroduced.

permissions:
  contents: read

jobs:
  java-mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -pl bootstrap -am verify -Pmutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-mutation-report
          path: apps/server/bootstrap/target/pit-reports/
          if-no-files-found: warn

  web-mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-mutation-report
          path: apps/web/reports/mutation/
          if-no-files-found: warn

  ai-mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai/requirements*.txt
            tests/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: mutmut run
      - run: mutmut results

  oidc-pkce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Keycloak
        run: |
          docker run --detach --name guanxian-keycloak --publish 18081:8080 \
            --env KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin \
            --env KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-keycloak-password \
            --volume "$PWD/tests/identity/keycloak-ci-realm.json:/opt/keycloak/data/import/guanxian-ci-realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.1 start-dev --import-realm
      - name: Wait for OIDC discovery
        run: |
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:18081/realms/guanxian-ci/.well-known/openid-configuration && exit 0
            sleep 2
          done
          docker logs guanxian-keycloak
          exit 1
      - name: Authorization Code and PKCE acceptance
        shell: pwsh
        run: >-
          ./tools/testing/Test-KeycloakPkce.ps1
          -Authority http://127.0.0.1:18081/realms/guanxian-ci
          -ClientId guanxian-web
          -Username ci-association-admin
          -Password ci-only-user-password
          -RedirectUri http://127.0.0.1:18082/auth/callback
          -AllowInsecureLoopback
