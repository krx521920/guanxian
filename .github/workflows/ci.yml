name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: apps/server/bootstrap/target/bootstrap-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest

  integration-smoke:
    needs: [server, ai]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: apps/server/bootstrap/target
      - run: python -m pip install -r services/ai/requirements.txt
      - name: Cross-module runtime contract smoke test
        shell: pwsh
        run: ./tests/smoke/runtime-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke-report
          path: test-results/smoke/
          if-no-files-found: warn
          retention-days: 7
