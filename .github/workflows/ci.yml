name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password-32chars
      MINIO_ROOT_USER: ci-minio-admin
      MINIO_ROOT_PASSWORD: ci-only-minio-password-32chars
      SPRING_PROFILES_ACTIVE: production
      GUANXIAN_SECURITY_MODE: jwt
      GUANXIAN_MEMBER_REPOSITORY: postgres
      GUANXIAN_BUSINESS_REPOSITORY: postgres
      GUANXIAN_SEED_DEMO_DATA: "false"
      GUANXIAN_JWT_ISSUER_URI: https://login.ci.internal/realms/guanxian
      GUANXIAN_JWT_JWK_SET_URI: https://login.ci.internal/realms/guanxian/protocol/openid-connect/certs
      GUANXIAN_JWT_PRINCIPAL_CLAIM: preferred_username
      GUANXIAN_STORAGE_BACKEND: minio
      GUANXIAN_STORAGE_BUCKET: guanxian-private
      GUANXIAN_STORAGE_ENDPOINT: https://storage.ci.internal
      GUANXIAN_STORAGE_ACCESS_KEY: ci-storage-app
      GUANXIAN_STORAGE_SECRET_KEY: ci-only-storage-secret-32chars
      GUANXIAN_STORAGE_REDIS_URL: rediss://redis.ci.internal:6380
      GUANXIAN_STORAGE_MAX_SIZE_BYTES: "20971520"
      GUANXIAN_STORAGE_RATE_LIMIT_ENABLED: "true"
      GUANXIAN_STORAGE_RATE_LIMIT_PER_MINUTE: "30"
      GUANXIAN_STORAGE_SCAN_HOST: clamav.ci.internal
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      GUANXIAN_AI_PROVIDER_ENABLED: "false"
      GUANXIAN_RAG_EXTERNAL_MODEL_DATA_EGRESS_ENABLED: "false"
      GUANXIAN_RAG_MAX_ESTIMATED_COST: "0.50"
      WEB_OIDC_AUTHORITY: https://login.ci.internal/realms/guanxian
      WEB_OIDC_CLIENT_ID: guanxian-web
      WEB_OIDC_REDIRECT_URI: https://platform.ci.internal/auth/callback
      WEB_OIDC_POST_LOGOUT_REDIRECT_URI: https://platform.ci.internal/login
      WEB_OIDC_SCOPE: openid profile email
      REDIS_EXPORTER_ADDR: rediss://redis.ci.internal:6380
      GRAFANA_ROOT_URL: https://grafana.ci.internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production environment contract
        run: python tools/deployment/validate_production_env.py
      - name: Prepare protected production Compose contract files
        run: bash ./.github/scripts/prepare-production-contract.sh
      - name: Test production environment validator
        run: python -m unittest discover -s tests/config -p "test_*.py"
      - name: Test database operations safety
        run: python -m unittest discover -s tests/operations -p "test_*.py"
      - name: Render production Compose configuration
        run: docker compose --file compose.production.yml --profile observability config --quiet

  production-restore-drill:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: guanxian
      POSTGRES_USER: guanxian
      GUANXIAN_JWT_ISSUER_URI: https://login.ci.internal/realms/guanxian
      GUANXIAN_JWT_JWK_SET_URI: https://login.ci.internal/realms/guanxian/protocol/openid-connect/certs
      GUANXIAN_STORAGE_ENDPOINT: https://storage.ci.internal
      GUANXIAN_STORAGE_SCAN_HOST: clamav.ci.internal
      WEB_OIDC_AUTHORITY: https://login.ci.internal/realms/guanxian
      WEB_OIDC_CLIENT_ID: guanxian-web
      WEB_OIDC_REDIRECT_URI: https://platform.ci.internal/auth/callback
      WEB_OIDC_POST_LOGOUT_REDIRECT_URI: https://platform.ci.internal/login
      REDIS_EXPORTER_ADDR: rediss://redis.ci.internal:6380
      GRAFANA_ROOT_URL: https://grafana.ci.internal
      GUANXIAN_ALLOW_TEST_RESTORE: I_UNDERSTAND_THIS_DROPS_TEST_DATA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare protected production Compose contract files
        run: bash ./.github/scripts/prepare-production-contract.sh
      - name: Start production PostgreSQL topology
        run: docker compose --file compose.production.yml up --detach --wait postgres
      - name: Seed a traceable source record
        run: |
          docker compose --file compose.production.yml exec --no-TTY postgres \
            psql --username guanxian --dbname guanxian --set ON_ERROR_STOP=1 \
            --command "CREATE TABLE IF NOT EXISTS flyway_schema_history(installed_rank integer primary key); CREATE TABLE IF NOT EXISTS restore_drill_sentinel(id integer primary key, value text not null); INSERT INTO restore_drill_sentinel VALUES (1, 'production-compose-restore-drill') ON CONFLICT (id) DO UPDATE SET value = excluded.value;"
      - name: Force and verify WAL archive readiness
        run: |
          mkdir -p test-results/restore-drill
          python tools/operations/postgres_pitr_readiness.py \
            --report test-results/restore-drill/pitr-readiness.json \
            --execute
      - name: Create backup and execute isolated restore drill
        run: |
          mkdir -p test-results/restore-drill/backups
          python tools/operations/postgres_backup.py --output-dir test-results/restore-drill/backups
          archive="$(find test-results/restore-drill/backups -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "${archive}"
          python tools/operations/postgres_restore_drill.py \
            --archive "${archive}" \
            --target-database guanxian_restore_test_ci \
            --confirm-target guanxian_restore_test_ci \
            --report test-results/restore-drill/report.json \
            --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-postgres-restore-drill
          path: |
            test-results/restore-drill/report.json
            test-results/restore-drill/pitr-readiness.json
            test-results/restore-drill/backups/*.manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop restore-drill topology
        if: always()
        run: docker compose --file compose.production.yml down --volumes

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: apps/server/bootstrap/target/bootstrap-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest

  integration-smoke:
    needs: [server, ai]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guanxian
          POSTGRES_USER: guanxian
          POSTGRES_PASSWORD: ci-only-smoke-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guanxian -d guanxian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/guanxian
      SPRING_DATASOURCE_USERNAME: guanxian
      SPRING_DATASOURCE_PASSWORD: ci-only-smoke-postgres-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: apps/server/bootstrap/target
      - run: python -m pip install -r services/ai/requirements.txt
      - name: Cross-module runtime contract smoke test
        shell: pwsh
        run: ./tests/smoke/runtime-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke-report
          path: test-results/smoke/
          if-no-files-found: warn
          retention-days: 7

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install normal browser E2E dependencies
        run: |
          python -m pip install openpyxl==3.1.5
          cd apps/web
          npm ci
          npx playwright install --with-deps chromium
      - name: Start isolated PostgreSQL, MinIO, Redis and OIDC stack
        shell: pwsh
        run: ./tools/testing/Start-E2eStack.ps1
      - name: Run repeatable browser business journeys
        working-directory: apps/web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e-report
          path: test-results/browser-e2e/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop isolated browser E2E stack
        if: always()
        run: docker compose --project-name guanxian-platform-e2e --project-directory . --env-file tests/e2e/compose.env --file compose.yaml --file compose.e2e.yaml --profile app down --volumes
