services:
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle=false
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - prometheus_scrape_token
    depends_on:
      - server
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.28.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:

secrets:
  prometheus_scrape_token:
    file: ${PROMETHEUS_SCRAPE_TOKEN_FILE:?PROMETHEUS_SCRAPE_TOKEN_FILE is required}
