services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ci-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ci-only-keycloak-password
    ports:
      - "18081:8080"
    volumes:
      - ./tests/identity/keycloak-ci-realm.json:/opt/keycloak/data/import/guanxian-ci-realm.json:ro
    restart: unless-stopped

  server:
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      GUANXIAN_JWT_ISSUER_URI: http://127.0.0.1:18081/realms/guanxian-ci
      GUANXIAN_JWT_JWK_SET_URI: http://keycloak:8080/realms/guanxian-ci/protocol/openid-connect/certs
      GUANXIAN_STORAGE_ENDPOINT: http://minio:9000
      GUANXIAN_STORAGE_REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 40s
    depends_on:
      keycloak:
        condition: service_started

  e2e-seed:
    profiles: ["app"]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-guanxian}
      POSTGRES_USER: ${POSTGRES_USER:-guanxian}
    volumes:
      - ./tests/e2e/postgres-seed.sql:/seed/postgres-seed.sql:ro
    entrypoint: ["sh", "-ec"]
    command:
      - |
        until psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atc "select 1 from information_schema.columns where table_name='audit_log' and column_name='resource_version'" | grep -q 1; do sleep 2; done
        psql -v ON_ERROR_STOP=1 -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -f /seed/postgres-seed.sql
    depends_on:
      server:
        condition: service_healthy
    restart: "no"

  web:
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
