spring:
  application:
    name: guanxian-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guanxian}
    username: ${SPRING_DATASOURCE_USERNAME:guanxian}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-migration-naming: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

guanxian:
  business:
    repository: ${GUANXIAN_BUSINESS_REPOSITORY:postgres}
  member:
    repository: ${GUANXIAN_MEMBER_REPOSITORY:postgres}
    association-name: ${GUANXIAN_ASSOCIATION_NAME:北京地下管线协会}
    seed-demo-data: ${GUANXIAN_SEED_DEMO_DATA:false}
  security:
    mode: ${GUANXIAN_SECURITY_MODE:jwt}
    jwt:
      issuer-uri: ${GUANXIAN_JWT_ISSUER_URI:}
      jwk-set-uri: ${GUANXIAN_JWT_JWK_SET_URI:}
      principal-claim: ${GUANXIAN_JWT_PRINCIPAL_CLAIM:preferred_username}

  ai:
    provider:
      enabled: ${GUANXIAN_AI_PROVIDER_ENABLED:false}
      endpoint: ${GUANXIAN_AI_PROVIDER_ENDPOINT:}
      api-key: ${GUANXIAN_AI_PROVIDER_API_KEY:}
      model: ${GUANXIAN_AI_PROVIDER_MODEL:}
      request-timeout: ${GUANXIAN_AI_PROVIDER_TIMEOUT:30s}
      max-output-tokens: ${GUANXIAN_AI_PROVIDER_MAX_OUTPUT_TOKENS:800}
      input-cost-per-million: ${GUANXIAN_AI_INPUT_COST_PER_MILLION:0}
      output-cost-per-million: ${GUANXIAN_AI_OUTPUT_COST_PER_MILLION:0}
    rag:
      chunk-size-chars: ${GUANXIAN_RAG_CHUNK_SIZE_CHARS:1200}
      chunk-overlap-chars: ${GUANXIAN_RAG_CHUNK_OVERLAP_CHARS:150}
      retrieval-limit: ${GUANXIAN_RAG_RETRIEVAL_LIMIT:5}
      max-question-chars: ${GUANXIAN_RAG_MAX_QUESTION_CHARS:2000}
      max-input-tokens: ${GUANXIAN_RAG_MAX_INPUT_TOKENS:6000}
      max-output-tokens: ${GUANXIAN_RAG_MAX_OUTPUT_TOKENS:800}
      max-estimated-cost: ${GUANXIAN_RAG_MAX_ESTIMATED_COST:0.50}
