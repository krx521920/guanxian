guanxian:
  storage:
    backend: ${GUANXIAN_STORAGE_BACKEND:minio}
    rate-limit:
      enabled: ${GUANXIAN_STORAGE_RATE_LIMIT_ENABLED:true}

# Spring Boot emits one JSON object per line in production. The request filter keeps
# `requestId` in MDC, which Spring's structured logger includes for correlation.
logging:
  include-application-name: true
  structured:
    format:
      console: logstash

management:
  endpoint:
    health:
      # The public /api/v1/health endpoint aggregates all registered indicators.
      # This named group also gives private operators a stable dependency contract.
      group:
        readiness:
          include: db,minioObjectStorage,redisAttachmentRateLimiter,oidcJwkSet
