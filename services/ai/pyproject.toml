[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guanxian-ai-service"
version = "0.1.0"
description = "北京地下管线协会 AI 管理协作平台独立 AI 服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "hypothesis>=6.112,<7.0",
  "mutmut>=3.2,<4.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings -m 'not stress and not fuzz'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "fuzz: opt-in generated-input tests excluded from project automation",
  "stress: opt-in high-load and concurrency tests",
]

[tool.mutmut]
source_paths = ["app/"]
only_mutate = ["app/services/*"]
pytest_add_cli_args = ["-q", "-m", "not stress and not fuzz"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
