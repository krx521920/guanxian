name: guanxian-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guanxian}
      POSTGRES_USER: ${POSTGRES_USER:-guanxian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai:
    profiles: ["app"]
    build:
      context: ./services/ai
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8001
      AI_MODEL_PROVIDER: disabled
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped

  server:
    profiles: ["app"]
    build:
      context: ./apps/server
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      AI_SERVICE_BASE_URL: http://ai:8001
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-guanxian}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-guanxian}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      GUANXIAN_MEMBER_REPOSITORY: postgres
      GUANXIAN_BUSINESS_REPOSITORY: postgres
      GUANXIAN_SEED_DEMO_DATA: "false"
      GUANXIAN_SECURITY_MODE: jwt
      GUANXIAN_JWT_ISSUER_URI: ${GUANXIAN_JWT_ISSUER_URI:?GUANXIAN_JWT_ISSUER_URI is required}
      GUANXIAN_JWT_JWK_SET_URI: ${GUANXIAN_JWT_JWK_SET_URI:?GUANXIAN_JWT_JWK_SET_URI is required}
      GUANXIAN_JWT_PRINCIPAL_CLAIM: ${GUANXIAN_JWT_PRINCIPAL_CLAIM:-preferred_username}
      GUANXIAN_STORAGE_BACKEND: minio
      GUANXIAN_STORAGE_BUCKET: ${GUANXIAN_STORAGE_BUCKET:-guanxian-private}
      GUANXIAN_STORAGE_ENDPOINT: ${GUANXIAN_STORAGE_ENDPOINT:?GUANXIAN_STORAGE_ENDPOINT is required and must be HTTPS}
      GUANXIAN_STORAGE_ACCESS_KEY: ${GUANXIAN_STORAGE_ACCESS_KEY:?GUANXIAN_STORAGE_ACCESS_KEY is required}
      GUANXIAN_STORAGE_SECRET_KEY: ${GUANXIAN_STORAGE_SECRET_KEY:?GUANXIAN_STORAGE_SECRET_KEY is required}
      GUANXIAN_STORAGE_REDIS_URL: ${GUANXIAN_STORAGE_REDIS_URL:?GUANXIAN_STORAGE_REDIS_URL is required and must use rediss}
      GUANXIAN_STORAGE_MAX_SIZE_BYTES: ${GUANXIAN_STORAGE_MAX_SIZE_BYTES:-20971520}
      GUANXIAN_STORAGE_RATE_LIMIT_ENABLED: "true"
      GUANXIAN_STORAGE_RATE_LIMIT_PER_MINUTE: ${GUANXIAN_STORAGE_RATE_LIMIT_PER_MINUTE:-30}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GUANXIAN_AI_PROVIDER_ENABLED: ${GUANXIAN_AI_PROVIDER_ENABLED:-false}
      GUANXIAN_AI_PROVIDER_ENDPOINT: ${GUANXIAN_AI_PROVIDER_ENDPOINT:-}
      GUANXIAN_AI_PROVIDER_API_KEY: ${GUANXIAN_AI_PROVIDER_API_KEY:-}
      GUANXIAN_AI_PROVIDER_MODEL: ${GUANXIAN_AI_PROVIDER_MODEL:-}
      GUANXIAN_AI_PROVIDER_TIMEOUT: ${GUANXIAN_AI_PROVIDER_TIMEOUT:-30s}
      GUANXIAN_AI_PROVIDER_MAX_OUTPUT_TOKENS: ${GUANXIAN_AI_PROVIDER_MAX_OUTPUT_TOKENS:-800}
      GUANXIAN_AI_INPUT_COST_PER_MILLION: ${GUANXIAN_AI_INPUT_COST_PER_MILLION:-0}
      GUANXIAN_AI_OUTPUT_COST_PER_MILLION: ${GUANXIAN_AI_OUTPUT_COST_PER_MILLION:-0}
      GUANXIAN_RAG_MAX_ESTIMATED_COST: ${GUANXIAN_RAG_MAX_ESTIMATED_COST:-0.50}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      ai:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
      args:
        VITE_AUTH_MODE: oidc
        VITE_OIDC_AUTHORITY: ${WEB_OIDC_AUTHORITY:?WEB_OIDC_AUTHORITY is required}
        VITE_OIDC_CLIENT_ID: ${WEB_OIDC_CLIENT_ID:?WEB_OIDC_CLIENT_ID is required}
        VITE_OIDC_REDIRECT_URI: ${WEB_OIDC_REDIRECT_URI:?WEB_OIDC_REDIRECT_URI is required}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${WEB_OIDC_POST_LOGOUT_REDIRECT_URI:?WEB_OIDC_POST_LOGOUT_REDIRECT_URI is required}
        VITE_OIDC_SCOPE: ${WEB_OIDC_SCOPE:-openid profile email}
    ports:
      - "${WEB_HTTP_PORT:-8081}:80"
    depends_on:
      - server
    restart: unless-stopped

  toxiproxy:
    profiles: ["chaos"]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"
      - "18002:18002"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
