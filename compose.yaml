name: guanxian-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guanxian}
      POSTGRES_USER: ${POSTGRES_USER:-guanxian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-guanxian}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ai:
    profiles: ["app"]
    build:
      context: ./services/ai
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8001
      AI_MODEL_PROVIDER: disabled
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped

  server:
    profiles: ["app"]
    build:
      context: ./apps/server
    environment:
      SERVER_PORT: 8080
      AI_SERVICE_BASE_URL: http://ai:8001
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      - ai
      - postgres
      - redis
      - minio
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
    ports:
      - "${WEB_HTTP_PORT:-8081}:80"
    depends_on:
      - server
    restart: unless-stopped

  toxiproxy:
    profiles: ["chaos"]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"
      - "18002:18002"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
