global:
  resolve_timeout: 5m

route:
  receiver: operator-log
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# Deliberately a safe sink for the checked-in profile. Operations must provide
# a separately managed receiver (webhook, email, or on-call integration) before
# relying on this profile for production alert delivery.
receivers:
  - name: operator-log
