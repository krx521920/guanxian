global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # This profile is for the private Compose network. Production deployments should
  # keep the same endpoint behind their TLS gateway and inject a short-lived OIDC
  # service token instead of storing a user credential in this repository.
  - job_name: guanxian-server
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_scrape_token
    static_configs:
      - targets: ["server:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # MinIO exposes its own authenticated Prometheus exporter. The target is
  # rendered from the production HTTPS endpoint into file_sd; the bearer token
  # remains a Compose secret and never enters this repository.
  - job_name: minio
    scheme: https
    metrics_path: /minio/v2/metrics/cluster
    authorization:
      type: Bearer
      credentials_file: /run/secrets/minio_prometheus_bearer_token
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/minio.json"]
