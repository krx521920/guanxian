name: guanxian-production

# Production-only topology. Only the TLS gateway is publicly reachable. The
# application, database and observability planes use separate private networks.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guanxian}
      POSTGRES_USER: ${POSTGRES_USER:-guanxian}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    expose: ["5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data-internal]
    restart: unless-stopped

  server:
    build:
      context: ./apps/server
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-guanxian}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-guanxian}
      GUANXIAN_MEMBER_REPOSITORY: postgres
      GUANXIAN_BUSINESS_REPOSITORY: postgres
      GUANXIAN_SEED_DEMO_DATA: "false"
      GUANXIAN_SECURITY_MODE: jwt
      GUANXIAN_JWT_ISSUER_URI: ${GUANXIAN_JWT_ISSUER_URI:?required}
      GUANXIAN_JWT_JWK_SET_URI: ${GUANXIAN_JWT_JWK_SET_URI:?required}
      GUANXIAN_JWT_PRINCIPAL_CLAIM: ${GUANXIAN_JWT_PRINCIPAL_CLAIM:-preferred_username}
      GUANXIAN_STORAGE_BACKEND: minio
      GUANXIAN_STORAGE_BUCKET: ${GUANXIAN_STORAGE_BUCKET:-guanxian-private}
      GUANXIAN_STORAGE_ENDPOINT: ${GUANXIAN_STORAGE_ENDPOINT:?required and must be HTTPS}
      GUANXIAN_STORAGE_MAX_SIZE_BYTES: ${GUANXIAN_STORAGE_MAX_SIZE_BYTES:-20971520}
      GUANXIAN_STORAGE_RATE_LIMIT_ENABLED: "true"
      GUANXIAN_STORAGE_RATE_LIMIT_PER_MINUTE: ${GUANXIAN_STORAGE_RATE_LIMIT_PER_MINUTE:-30}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-20MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-21MB}
      GUANXIAN_AI_PROVIDER_ENABLED: ${GUANXIAN_AI_PROVIDER_ENABLED:-false}
      GUANXIAN_AI_PROVIDER_ENDPOINT: ${GUANXIAN_AI_PROVIDER_ENDPOINT:-}
      GUANXIAN_AI_PROVIDER_MODEL: ${GUANXIAN_AI_PROVIDER_MODEL:-}
      GUANXIAN_RAG_EXTERNAL_MODEL_DATA_EGRESS_ENABLED: ${GUANXIAN_RAG_EXTERNAL_MODEL_DATA_EGRESS_ENABLED:-false}
      GUANXIAN_RAG_MAX_ESTIMATED_COST: ${GUANXIAN_RAG_MAX_ESTIMATED_COST:-0.50}
      GUANXIAN_RAG_MAX_DOCUMENT_CHARS: ${GUANXIAN_RAG_MAX_DOCUMENT_CHARS:-2000000}
      GUANXIAN_RAG_MAX_DOCUMENT_BYTES: ${GUANXIAN_RAG_MAX_DOCUMENT_BYTES:-20971520}
      GUANXIAN_EMBEDDING_ENABLED: ${GUANXIAN_EMBEDDING_ENABLED:-false}
      GUANXIAN_EMBEDDING_ENDPOINT: ${GUANXIAN_EMBEDDING_ENDPOINT:-}
      GUANXIAN_EMBEDDING_MODEL: ${GUANXIAN_EMBEDDING_MODEL:-}
      GUANXIAN_EMBEDDING_DIMENSIONS: ${GUANXIAN_EMBEDDING_DIMENSIONS:-1536}
      GUANXIAN_EMBEDDING_MAX_BATCH_SIZE: ${GUANXIAN_EMBEDDING_MAX_BATCH_SIZE:-32}
      GUANXIAN_EMBEDDING_TIMEOUT: ${GUANXIAN_EMBEDDING_TIMEOUT:-30s}
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: storage_access_key
        target: guanxian.storage.access-key
      - source: storage_secret_key
        target: guanxian.storage.secret-key
      - source: storage_redis_url
        target: guanxian.storage.redis-url
      - source: embedding_api_key
        target: guanxian.ai.embedding.api-key
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s
    networks: [app-internal, data-internal, egress]
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_AUTH_MODE: oidc
        VITE_OIDC_AUTHORITY: ${WEB_OIDC_AUTHORITY:?required}
        VITE_OIDC_CLIENT_ID: ${WEB_OIDC_CLIENT_ID:?required}
        VITE_OIDC_REDIRECT_URI: ${WEB_OIDC_REDIRECT_URI:?required}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${WEB_OIDC_POST_LOGOUT_REDIRECT_URI:?required}
        VITE_OIDC_SCOPE: ${WEB_OIDC_SCOPE:-openid profile email}
    expose: ["8080"]
    depends_on:
      server:
        condition: service_healthy
    networks: [app-internal]
    restart: unless-stopped

  gateway:
    image: nginx:1.27.5-alpine
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key
    depends_on:
      web:
        condition: service_healthy
    networks: [edge, app-internal]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle=false
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - prometheus_scrape_token
    depends_on: [server, alertmanager]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [app-internal, observability-internal]
    restart: unless-stopped

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.28.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:?rendered production alertmanager config is required}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks: [observability-internal]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.4
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose: ["3100"]
    networks: [observability-internal]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.4
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/run/promtail
    depends_on: [loki]
    networks: [observability-internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?private Grafana URL is required}
    secrets: [grafana_admin_password]
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki]
    networks: [observability-internal]
    restart: unless-stopped

networks:
  edge: {}
  egress: {}
  app-internal:
    internal: true
  data-internal:
    internal: true
  observability-internal:
    internal: true

volumes:
  postgres-data: {}
  prometheus-data: {}
  alertmanager-data: {}
  loki-data: {}
  promtail-data: {}
  grafana-data: {}

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?required}
  storage_access_key:
    file: ${STORAGE_ACCESS_KEY_FILE:?required}
  storage_secret_key:
    file: ${STORAGE_SECRET_KEY_FILE:?required}
  storage_redis_url:
    file: ${STORAGE_REDIS_URL_FILE:?required and must contain a rediss URL}
  embedding_api_key:
    file: ${EMBEDDING_API_KEY_FILE:?required; use an empty protected file while embeddings are disabled}
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?required}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?required}
  prometheus_scrape_token:
    file: ${PROMETHEUS_SCRAPE_TOKEN_FILE:?required}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?required}
